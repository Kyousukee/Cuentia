[build]
  command = "npm run build"
  publish = "dist/cuentia/browser"

[build.environment]
  NODE_VERSION = "22"

# App de una sola página: todas las rutas sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y el manifest no deben quedar en caché, para recibir actualizaciones
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
